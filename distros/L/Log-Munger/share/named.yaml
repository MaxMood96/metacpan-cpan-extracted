      - string: 'BIND 9 is maintained by Internet Systems Consortium,'
        result: 'BIND 9 is maintained by Internet Systems Consortium,'
    negative:
      - ''
# Additional primitives used above that are not in base.yaml.
vars:
  # NOTSPACE that also excludes "/" (so a "name/type/class" triple can be split)
  NOTSPACE_NO_SLASH: '[^\s/]+'
  # NOTSPACE that also excludes ":" (so a "file:line" pair can be split)
  NOTSPACE_NO_COLON: '[^\s:]+'
  # a run of non-quote characters (used to bound a leading error phrase)
  GREEDYDATA_NO_QUOTE: '[^'']*'
# Look up any captured client / source IP.
geoip:
  - dns_client_ip
  - dns_src_ip
# Coerce numeric captures (ports / serials) to integers.
convert:
  dns_client_port: int
  dns_src_port: int
  dns_zone_serial: int
  dns_zone_file_line: int
  dns_listen_port: int
  dns_clients_per_query: int
rules:
  - name: named
    gate:
      - field: PROGRAM
        values:
          - '//^named$//'
    field: MESSAGE
    anchored: true
    patterns:
      - NAMED_QUERY
      - NAMED_QUERY_DENIED
      - NAMED_XFR_CLIENT
      - NAMED_XFR_FROM
      - NAMED_ZONE_LOAD
      - NAMED_ZONE_LOAD_FAILED
      - NAMED_DNSSEC
      - NAMED_RRL
      - NAMED_DDNS
      - NAMED_LAME
      - NAMED_FORMAT_ERROR
      # ahead of NAMED_NET_ERROR, whose free-text dns_error would swallow the
      # RCODE
      - NAMED_RCODE_ERROR
      - NAMED_NET_ERROR
      - NAMED_QNAME_MIN
      - NAMED_LOOP
      - NAMED_HUNG_FETCH
      - NAMED_SKIP_NS
      - NAMED_COOKIE
      - NAMED_EMPTY_ZONE
      - NAMED_TAT
      - NAMED_LISTEN_START
      - NAMED_LISTEN_STOP
      - NAMED_MANAGED_KEYS
      - NAMED_PRIMING
      - NAMED_CHANNEL_START
      - NAMED_CHANNEL_STOP
      - NAMED_CLIENTS_PER_QUERY
      - NAMED_STARTING
      - NAMED_RUNNING_AS
      - NAMED_STATE
      - NAMED_ZONE_FILE_ERROR
      # after every "zone <name>/<class>: ..." pattern above, because it
      # matches any of them
      - NAMED_ZONE_STATUS
      # last: matches anything, which is only safe because the rule is gated
      - NAMED_MESSAGE
    tests:
      positive:
        - string: 'client @0x7f8b1c0d5e00 192.0.2.5#54321 (example.com): query: example.com IN A +E(0)K (192.0.2.1)'
          numeric:
            - dns_client_port
          result:
            dns_client_ip: '192.0.2.5'
            dns_client_port: '54321'
            dns_query_name: 'example.com'
            dns_query_class: 'IN'
            dns_query_type: 'A'
            dns_flags: '+E(0)K'
            dns_server_ip: '192.0.2.1'
        - string: 'client 198.51.100.9#40000 (test.org): query: test.org IN AAAA + (192.0.2.1)'
          result:
            dns_client_ip: '198.51.100.9'
            dns_client_port: '40000'
            dns_query_name: 'test.org'
            dns_query_class: 'IN'
            dns_query_type: 'AAAA'
            dns_flags: '+'
            dns_server_ip: '192.0.2.1'
        - string: 'client @0x55a 203.0.113.7#1234 (a.b.c): query: a.b.c IN MX +E (192.0.2.1)'
          result:
            dns_client_ip: '203.0.113.7'
            dns_client_port: '1234'
            dns_query_name: 'a.b.c'
            dns_query_class: 'IN'
            dns_query_type: 'MX'
            dns_flags: '+E'
            dns_server_ip: '192.0.2.1'
        - string: 'client @0x7f 203.0.113.7#40000 (example.com): query (cache) ''example.com/A/IN'' denied'
          result:
            dns_client_ip: '203.0.113.7'
            dns_client_port: '40000'
            dns_query_source: 'cache'
            dns_query_name: 'example.com'
            dns_query_type: 'A'
            dns_query_class: 'IN'
        - string: 'client 198.51.100.9#40000 (test.org): query ''test.org/AAAA/IN'' denied'
          result:
            dns_client_ip: '198.51.100.9'
            dns_client_port: '40000'
            dns_query_name: 'test.org'
            dns_query_type: 'AAAA'
            dns_query_class: 'IN'
        - string: 'client 192.0.2.9#5300 (example.com): transfer of ''example.com/IN'': AXFR started'
          result:
            dns_client_ip: '192.0.2.9'
            dns_client_port: '5300'
            dns_zone_name: 'example.com'
            dns_query_class: 'IN'
            dns_xfr_type: 'AXFR'
            dns_xfr_state: 'started'
        - string: 'client 192.0.2.9#5300 (example.com): transfer of ''example.com/IN'': AXFR-style IXFR ended'
          result:
            dns_client_ip: '192.0.2.9'
            dns_client_port: '5300'
            dns_zone_name: 'example.com'
            dns_query_class: 'IN'
            dns_xfr_type: 'AXFR-style IXFR'
            dns_xfr_state: 'ended'
        - string: 'transfer of ''example.com/IN'' from 192.0.2.2#53: failed while receiving responses: end of file'
          numeric:
            - dns_src_port
          result:
            dns_zone_name: 'example.com'
            dns_query_class: 'IN'
            dns_src_ip: '192.0.2.2'
            dns_src_port: '53'
            dns_xfr_result: 'failed while receiving responses: end of file'
        - string: 'zone example.com/IN: loaded serial 2024010101'
          numeric:
            - dns_zone_serial
          program: 'named'
          result:
            dns_zone_name: 'example.com'
            dns_query_class: 'IN'
            dns_zone_serial: '2024010101'
        - string: 'validating example.com/A: no valid signature found'
          result:
            dns_query_name: 'example.com'
            dns_query_type: 'A'
            dns_dnssec_result: 'no valid signature found'
        - string: 'validating example.com/A: insecurity proof failed'
          result:
            dns_query_name: 'example.com'
            dns_query_type: 'A'
            dns_dnssec_result: 'insecurity proof failed'
        - string: 'client 203.0.113.7#40000 (example.com): rate limit slip response to 203.0.113.0/24 for example.com IN A  (abcd1234)'
          result:
            dns_client_ip: '203.0.113.7'
            dns_client_port: '40000'
            dns_rrl_action: 'slip'
            dns_rrl_kind: 'response'
            dns_rrl_network: '203.0.113.0/24'
            dns_query_name: 'example.com'
            dns_query_class: 'IN'
            dns_query_type: 'A'
        - string: 'client 203.0.113.7#40000 (example.com): rate limit drop responses to 203.0.113.0/24 for example.com IN A  (abcd1234)'
          result:
            dns_client_ip: '203.0.113.7'
            dns_client_port: '40000'
            dns_rrl_action: 'drop'
            dns_rrl_kind: 'responses'
            dns_rrl_network: '203.0.113.0/24'
            dns_query_name: 'example.com'
            dns_query_class: 'IN'
            dns_query_type: 'A'
        - string: 'client 192.0.2.9#40000: updating zone ''example.com/IN'': adding an RR at ''host.example.com'' A 192.0.2.50'
          result:
            dns_client_ip: '192.0.2.9'
            dns_client_port: '40000'
            dns_zone_name: 'example.com'
            dns_query_class: 'IN'
            dns_ddns_op: 'adding an RR at ''host.example.com'' A 192.0.2.50'
        - string: 'lame server resolving ''example.com'' (in ''example.com''?): 192.0.2.2#53'
          result:
            dns_query_name: 'example.com'
            dns_zone_name: 'example.com'
            dns_src_ip: '192.0.2.2'
            dns_src_port: '53'
        - string: 'network unreachable resolving ''example.com/A/IN'': 2001:db8::1#53'
          result:
            dns_error: 'network unreachable'
            dns_query_name: 'example.com'
            dns_query_type: 'A'
            dns_query_class: 'IN'
            dns_src_ip: '2001:db8::1'
            dns_src_port: '53'
        - string: 'zone 255.in-addr.arpa/IN/internal-view: loading from master file /usr/local/etc/namedb/master/empty.db failed: file not found'
          result:
            dns_zone_name: '255.in-addr.arpa'
            dns_query_class: 'IN'
            dns_view: 'internal-view'
            dns_zone_file: '/usr/local/etc/namedb/master/empty.db'
            dns_zone_error: 'file not found'
        - string: 'zone localhost/IN/internal-view: not loaded due to errors.'
          result:
            dns_zone_name: 'localhost'
            dns_query_class: 'IN'
            dns_view: 'internal-view'
            dns_zone_status: 'not loaded due to errors.'
        - string: "/usr/local/etc/namedb/master/example.db:11: unknown RR type 'MS'"
          numeric:
            - dns_zone_file_line
          result:
            dns_zone_file: '/usr/local/etc/namedb/master/example.db'
            dns_zone_file_line: '11'
            dns_zone_error: "unknown RR type 'MS'"
        - string: 'DNS format error from 192.0.2.2#53 resolving a.example.com/AAAA for 198.51.100.9#28116: Name example.com (SOA) not subdomain of zone a.example.com -- invalid response'
          result:
            dns_src_ip: '192.0.2.2'
            dns_src_port: '53'
            dns_query_name: 'a.example.com'
            dns_query_type: 'AAAA'
            dns_client_ip: '198.51.100.9'
            dns_client_port: '28116'
            dns_error: 'Name example.com (SOA) not subdomain of zone a.example.com -- invalid response'
        - string: 'DNS format error from 192.0.2.2#53 resolving a.example.com/NS for <unknown>: reply has no answer'
          result:
            dns_src_ip: '192.0.2.2'
            dns_src_port: '53'
            dns_query_name: 'a.example.com'
            dns_query_type: 'NS'
            dns_error: 'reply has no answer'
        - string: "managed-keys-zone/internal-view: Unable to fetch DNSKEY set '.': failure"
          result:
            dns_view: 'internal-view'
            dns_managed_keys_message: "Unable to fetch DNSKEY set '.': failure"
        - string: 'resolver priming query complete: failure'
          result:
            dns_priming_result: 'failure'
        - string: 'command channel listening on 127.0.0.1#953'
          numeric:
            - dns_listen_port
          result:
            dns_channel: 'command'
            dns_channel_action: 'listening'
            dns_listen_ip: '127.0.0.1'
            dns_listen_port: '953'
        - string: 'stopping statistics channel on 127.0.0.1#8053'
          result:
            dns_channel: 'statistics'
            dns_channel_action: 'stopping'
            dns_listen_ip: '127.0.0.1'
            dns_listen_port: '8053'
        - string: 'clients-per-query increased to 15'
          numeric:
            - dns_clients_per_query
          result:
            dns_cpq_direction: 'increased'
            dns_clients_per_query: '15'
        - string: 'starting BIND 9.18.30 (Extended Support Version) <id:>'
          result:
            dns_version: '9.18.30'
            dns_version_note: 'Extended Support Version'
            dns_build_id: ''
        - string: 'running as: named -4 -u root -c /usr/local/etc/namedb/named.conf'
          result:
            dns_command_line: 'named -4 -u root -c /usr/local/etc/namedb/named.conf'
        - string: 'all zones loaded'
          result:
            dns_state: 'all zones loaded'
        - string: 'REFUSED unexpected RCODE resolving ''example.com/A/IN'': 192.0.2.2#53'
          result:
            dns_rcode: 'REFUSED'
            dns_error: 'unexpected RCODE'
            dns_query_name: 'example.com'
            dns_query_type: 'A'
            dns_query_class: 'IN'
            dns_src_ip: '192.0.2.2'
            dns_src_port: '53'
        # no RCODE on the front, so this one still lands in NAMED_NET_ERROR
        - string: 'connection refused resolving ''test.org/AAAA/IN'': 198.51.100.9#53'
          result:
            dns_error: 'connection refused'
            dns_query_name: 'test.org'
            dns_query_type: 'AAAA'
            dns_query_class: 'IN'
            dns_src_ip: '198.51.100.9'
            dns_src_port: '53'
        - string: 'view internal-view:   validating example.com/SOA: no valid signature found'
          result:
            dns_view: 'internal-view'
            dns_query_name: 'example.com'
            dns_query_type: 'SOA'
            dns_dnssec_result: 'no valid signature found'
        - string: 'success resolving ''example.com/A'' after disabling qname minimization due to ''ncache nxdomain'''
          result:
            dns_qname_min_result: 'success'
            dns_query_name: 'example.com'
            dns_query_type: 'A'
            dns_qname_min_reason: 'ncache nxdomain'
        - string: 'loop detected resolving ''ns1.example.com/A'''
          result:
            dns_error: 'loop detected'
            dns_query_name: 'ns1.example.com'
            dns_query_type: 'A'
        - string: 'shut down hung fetch while resolving ''example.com/A'''
          result:
            dns_error: 'shut down hung fetch'
            dns_query_name: 'example.com'
            dns_query_type: 'A'
