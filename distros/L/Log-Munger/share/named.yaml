---
# named / BIND9 log enrichment.
#
# Gates on the syslog PROGRAM field being "named". Patterns are anchored (each
# must match the whole MESSAGE) and first-match wins. Every capture is
# namespaced with dns_ .
#
# BIND query-log lines look like:
#   client @0x7f8b1c0d5e00 192.0.2.5#54321 (example.com): query: example.com IN A +E(0)K (192.0.2.1)
# The "@0x..." internal address token is optional, as is the trailing
# "(server_ip)" reporting which local address answered.
#
# In addition to the query log, BIND emits many other daemon messages: query
# denials, zone transfers (AXFR/IXFR), zone loads, DNSSEC validation results,
# response-rate-limiting (RRL), dynamic DNS (DDNS) updates, lame-server reports
# and general network/resolution errors. Those are parsed by the patterns
# appended after NAMED_QUERY below.
includes:
- base
vars_templated:
  # A single BIND9 query-log line. Tolerates the optional "@0x..." client
  # address token and the optional trailing "(server_ip)".
  NAMED_QUERY: 'client(?: @0x[0-9a-fA-F]+)? (?<dns_client_ip>[% IP %])#(?<dns_client_port>[% INT %])(?: \([% DATA %]\))?: query: (?<dns_query_name>[% NOTSPACE %]) (?<dns_query_class>[% WORD %]) (?<dns_query_type>[% WORD %]) (?<dns_flags>[% NOTSPACE %])(?: \((?<dns_server_ip>[% IP %])\))?'
  # Query denied by an ACL, e.g.:
  #   client @0x7f 203.0.113.7#40000 (example.com): query (cache) 'example.com/A/IN' denied
  # The "@0x..." token and "(cache)"/"(recursion)" qualifier are optional, as is
  # the "(view)" between the client address and the colon.
  NAMED_QUERY_DENIED: 'client(?: @0x[0-9a-fA-F]+)? (?<dns_client_ip>[% IP %])#(?<dns_client_port>[% INT %])(?: \([% DATA %]\))?: query(?: \((?<dns_query_source>[% WORD %])\))? ''(?<dns_query_name>[% NOTSPACE_NO_SLASH %])/(?<dns_query_type>[% WORD %])/(?<dns_query_class>[% WORD %])'' denied(?: [% GREEDYDATA %])?'
  # Zone transfer start, e.g.:
  #   client 192.0.2.9#5300 (example.com): transfer of 'example.com/IN': AXFR started
  #   client 192.0.2.9#5300 (example.com): transfer of 'example.com/IN': AXFR-style IXFR ended
  NAMED_XFR_CLIENT: 'client(?: @0x[0-9a-fA-F]+)? (?<dns_client_ip>[% IP %])#(?<dns_client_port>[% INT %])(?: \([% DATA %]\))?: transfer of ''(?<dns_zone_name>[% NOTSPACE_NO_SLASH %])/(?<dns_query_class>[% WORD %])'': (?<dns_xfr_type>(?:AXFR-style IXFR|AXFR|IXFR)) (?<dns_xfr_state>started|ended|deferred)(?: [% GREEDYDATA %])?'
  # Outbound/failed zone transfer from a master, e.g.:
  #   transfer of 'example.com/IN' from 192.0.2.2#53: failed while receiving responses: ...
  NAMED_XFR_FROM: 'transfer of ''(?<dns_zone_name>[% NOTSPACE_NO_SLASH %])/(?<dns_query_class>[% WORD %])'' from (?<dns_src_ip>[% IP %])#(?<dns_src_port>[% INT %]): (?<dns_xfr_result>[% GREEDYDATA %])'
  # Zone load, e.g.:
  #   zone example.com/IN: loaded serial 2024010101
  #   zone example.com/IN/internal-view: loaded serial 2024010101
  # When views are configured the zone name carries a third "/view" component.
  NAMED_ZONE_LOAD: 'zone (?<dns_zone_name>[% NOTSPACE_NO_SLASH %])/(?<dns_query_class>[% WORD %])(?:/(?<dns_view>[% NOTSPACE_NO_SLASH %]))?: loaded serial (?<dns_zone_serial>[% INT %])(?: [% GREEDYDATA %])?'
  # A zone that could not be read at all, e.g.:
  #   zone 255.in-addr.arpa/IN/internal-view: loading from master file /usr/local/etc/namedb/master/empty.db failed: file not found
  NAMED_ZONE_LOAD_FAILED: 'zone (?<dns_zone_name>[% NOTSPACE_NO_SLASH %])/(?<dns_query_class>[% WORD %])(?:/(?<dns_view>[% NOTSPACE_NO_SLASH %]))?: loading from master file (?<dns_zone_file>[% NOTSPACE %]) failed: (?<dns_zone_error>[% GREEDYDATA %])'
  # Anything else said about a named zone. This has to sit after the two
  # patterns above because it would otherwise swallow them, e.g.:
  #   zone localhost/IN/internal-view: not loaded due to errors.
  #   zone example.com/IN/internal-view: has no NS records
  #   zone example.com/IN: sending notifies (serial 2024010101)
  NAMED_ZONE_STATUS: 'zone (?<dns_zone_name>[% NOTSPACE_NO_SLASH %])/(?<dns_query_class>[% WORD %])(?:/(?<dns_view>[% NOTSPACE_NO_SLASH %]))?: (?<dns_zone_status>[% GREEDYDATA %])'
  # A syntax problem in a zone file, reported with the file and the line it was
  # found on, e.g.:
  #   /usr/local/etc/namedb/master/example.db:11: unknown RR type 'MS'
  #   /usr/local/etc/namedb/master/example.db:2: ignoring out-of-zone data (a.example.com)
  NAMED_ZONE_FILE_ERROR: '(?<dns_zone_file>/[% NOTSPACE_NO_COLON %]):(?<dns_zone_file_line>[% INT %]): (?<dns_zone_error>[% GREEDYDATA %])'
  # A malformed answer from an authoritative server, e.g.:
  #   DNS format error from 192.0.2.2#53 resolving a.example.com/AAAA for 198.51.100.9#28116: Name example.com (SOA) not subdomain of zone a.example.com -- invalid response
  # The "for" clause names the client the lookup was on behalf of, and is the
  # literal "<unknown>" when named generated the query itself.
  NAMED_FORMAT_ERROR: 'DNS format error from (?<dns_src_ip>[% IP %])#(?<dns_src_port>[% INT %]) resolving (?<dns_query_name>[% NOTSPACE_NO_SLASH %])/(?<dns_query_type>[% WORD %]) for (?:<unknown>|(?<dns_client_ip>[% IP %])#(?<dns_client_port>[% INT %])): (?<dns_error>[% GREEDYDATA %])'
  # The root-hint priming fetch a resolver does at startup, e.g.:
  #   resolver priming query complete: failure
  # Older releases logged it with no result at all, so the result is optional.
  NAMED_PRIMING: 'resolver priming query complete(?:: (?<dns_priming_result>[% GREEDYDATA %]))?'
  # RFC 5011 trust-anchor maintenance, e.g.:
  #   managed-keys-zone/internal-view: Unable to fetch DNSKEY set '.': failure
  #   managed-keys-zone: Initializing automatic trust anchor management for zone '.'
  NAMED_MANAGED_KEYS: 'managed-keys-zone(?:/(?<dns_view>[% NOTSPACE_NO_SLASH %]))?: (?<dns_managed_keys_message>[% GREEDYDATA %])'
  # The rndc control and statistics listeners coming up and going away, e.g.:
  #   command channel listening on 127.0.0.1#953
  #   stopping statistics channel on 127.0.0.1#8053
  NAMED_CHANNEL_START: '(?<dns_channel>command|statistics) channel (?<dns_channel_action>listening) on (?<dns_listen_ip>[% IP %])#(?<dns_listen_port>[% INT %])'
  NAMED_CHANNEL_STOP: '(?<dns_channel_action>stopping) (?<dns_channel>command|statistics) channel on (?<dns_listen_ip>[% IP %])#(?<dns_listen_port>[% INT %])'
  # The recursive-client quota adapting to load, e.g.:
  #   clients-per-query increased to 15
  NAMED_CLIENTS_PER_QUERY: 'clients-per-query (?<dns_cpq_direction>increased|decreased) to (?<dns_clients_per_query>[% INT %])'
  # Startup banner version line, e.g.:
  #   starting BIND 9.18.30 (Extended Support Version) <id:>
  NAMED_STARTING: 'starting BIND (?<dns_version>[% NOTSPACE %])(?: \((?<dns_version_note>[^)]*)\))?(?: <id:(?<dns_build_id>[^>]*)>)?'
  # The argv named was started with, e.g.:
  #   running as: named -4 -u root -c /usr/local/etc/namedb/named.conf
  NAMED_RUNNING_AS: 'running as: (?<dns_command_line>[% GREEDYDATA %])'
  # Bare lifecycle words. named logs each on a line of its own with nothing
  # else on it, so they are named rather than left to the catch-all.
  NAMED_STATE: '(?<dns_state>running|exiting|all zones loaded|shutting down|reloading configuration succeeded|loading configuration from [% NOTSPACE %])'
  # DNSSEC validation result, e.g.:
  #   validating example.com/A: no valid signature found
  #   validating example.com/A: insecurity proof failed
  # With views configured the line is prefixed with the view it happened in, and
  # BIND pads the gap between the colon and "validating" to line the names up:
  #   view internal-view: validating example.com/A: no valid signature found
  #   view internal-view:   validating example.com/SOA: no valid signature found
  NAMED_DNSSEC: '(?:view (?<dns_view>[% NOTSPACE_NO_COLON %]): +)?validating (?:@0x[0-9a-fA-F]+: )?(?<dns_query_name>[% NOTSPACE_NO_SLASH %])/(?<dns_query_type>[% WORD %]): (?<dns_dnssec_result>[% GREEDYDATA %])'
  # Response-rate-limiting (RRL) action, e.g.:
  #   client 203.0.113.7#40000 (example.com): rate limit slip response to 203.0.113.0/24 for example.com IN A  (abcd1234)
  #   client 203.0.113.7#40000 (example.com): rate limit drop responses to ...
  NAMED_RRL: 'client(?: @0x[0-9a-fA-F]+)? (?<dns_client_ip>[% IP %])#(?<dns_client_port>[% INT %])(?: \([% DATA %]\))?: rate limit (?<dns_rrl_action>[% WORD %]) (?<dns_rrl_kind>[% WORD %]) to (?<dns_rrl_network>[% NOTSPACE %])(?: for (?<dns_query_name>[% NOTSPACE %]) (?<dns_query_class>[% WORD %]) (?<dns_query_type>[% WORD %]))?(?: [% GREEDYDATA %])?'
  # Dynamic DNS (DDNS) update, e.g.:
  #   client 192.0.2.9#40000: updating zone 'example.com/IN': adding an RR at 'host.example.com' A 192.0.2.50
  NAMED_DDNS: 'client(?: @0x[0-9a-fA-F]+)? (?<dns_client_ip>[% IP %])#(?<dns_client_port>[% INT %])(?: \([% DATA %]\))?: updating zone ''(?<dns_zone_name>[% NOTSPACE_NO_SLASH %])/(?<dns_query_class>[% WORD %])'': (?<dns_ddns_op>[% GREEDYDATA %])'
  # Lame server report, e.g.:
  #   lame server resolving 'example.com' (in 'example.com'?): 192.0.2.2#53
  NAMED_LAME: 'lame server resolving ''(?<dns_query_name>[% NOTSPACE %])''(?: \(in ''(?<dns_zone_name>[% NOTSPACE %])''\?\))?: (?<dns_src_ip>[% IP %])#(?<dns_src_port>[% INT %])(?: [% GREEDYDATA %])?'
  # An authoritative server answering with an error RCODE, e.g.:
  #   REFUSED unexpected RCODE resolving 'example.com/A/IN': 192.0.2.2#53
  #   SERVFAIL unexpected RCODE resolving 'test.org/AAAA/IN': 198.51.100.9#53
  # This is the same shape as NAMED_NET_ERROR and would otherwise land there
  # with the RCODE buried in the free-text dns_error, so it has to sit ahead of
  # it. dns_error is still filled in, with the phrase minus the RCODE, so
  # anything keying off dns_error keeps working.
  NAMED_RCODE_ERROR: '(?<dns_rcode>[% WORD %]) (?<dns_error>unexpected RCODE) resolving ''(?<dns_query_name>[% NOTSPACE_NO_SLASH %])/(?<dns_query_type>[% WORD %])/(?<dns_query_class>[% WORD %])'': (?<dns_src_ip>[% IP %])#(?<dns_src_port>[% INT %])(?: [% GREEDYDATA %])?'
  # General resolution / network error, e.g.:
  #   network unreachable resolving 'example.com/A/IN': 2001:db8::1#53
  #   host unreachable resolving 'example.com/A/IN': 192.0.2.2#53
  NAMED_NET_ERROR: '(?<dns_error>[% GREEDYDATA_NO_QUOTE %]) resolving ''(?<dns_query_name>[% NOTSPACE_NO_SLASH %])/(?<dns_query_type>[% WORD %])/(?<dns_query_class>[% WORD %])'': (?<dns_src_ip>[% IP %])#(?<dns_src_port>[% INT %])(?: [% GREEDYDATA %])?'
  # A resolution that only succeeded once qname minimisation was turned off for
  # it, e.g.:
  #   success resolving 'example.com/A' after disabling qname minimization due to 'ncache nxdomain'
  # The leading word is the outcome and the quoted tail is why minimisation was
  # abandoned. There is no server address on these.
  NAMED_QNAME_MIN: '(?<dns_qname_min_result>[% WORD %]) resolving ''(?<dns_query_name>[% NOTSPACE_NO_SLASH %])/(?<dns_query_type>[% WORD %])'' after disabling qname minimization due to ''(?<dns_qname_min_reason>[^'']*)'''
  # A delegation that points at itself, e.g.:
  #   loop detected resolving 'ns1.example.com/A'
  NAMED_LOOP: '(?<dns_error>loop detected) resolving ''(?<dns_query_name>[% NOTSPACE_NO_SLASH %])/(?<dns_query_type>[% WORD %])'''
  # A fetch abandoned because it never came back, e.g.:
  #   shut down hung fetch while resolving 'example.com/A'
  NAMED_HUNG_FETCH: '(?<dns_error>shut down hung fetch) while resolving ''(?<dns_query_name>[% NOTSPACE_NO_SLASH %])/(?<dns_query_type>[% WORD %])'''
  # A nameserver skipped because the NS record points at a CNAME, e.g.:
  #   skipping nameserver 'ns1.example.com' because it is a CNAME, while resolving 'test.org/A'
  NAMED_SKIP_NS: 'skipping nameserver ''(?<dns_nameserver>[^'']*)'' because it is a (?<dns_skip_reason>[% GREEDYDATA_NO_QUOTE %]), while resolving ''(?<dns_query_name>[% NOTSPACE_NO_SLASH %])/(?<dns_query_type>[% WORD %])'''
  # DNS cookie (RFC 7873) trouble with an upstream server, e.g.:
  #   bad cookie from 192.0.2.2#53
  #   missing expected cookie from 198.51.100.9#53
  NAMED_COOKIE: '(?<dns_cookie_problem>bad|missing expected) cookie from (?<dns_src_ip>[% IP %])#(?<dns_src_port>[% INT %])'
  # An RFC 1918 / special-use zone named answered for itself rather than asking
  # upstream, logged once per zone per view at startup, e.g.:
  #   automatic empty zone: view internal-view: 10.IN-ADDR.ARPA
  #   automatic empty zone: 10.IN-ADDR.ARPA
  NAMED_EMPTY_ZONE: 'automatic empty zone: (?:view (?<dns_view>[% NOTSPACE_NO_COLON %]): )?(?<dns_zone_name>[% NOTSPACE %])'
  # RFC 8145 trust-anchor telemetry, which reports the root keys this resolver
  # holds back to the root servers, e.g.:
  #   internal-view: sending trust-anchor-telemetry query '_ta-4f66-9728/NULL'
  NAMED_TAT: '(?<dns_view>[% NOTSPACE_NO_COLON %]): sending trust-anchor-telemetry query ''(?<dns_query_name>[% NOTSPACE_NO_SLASH %])/(?<dns_query_type>[% WORD %])'''
  # An address named picked up or dropped during interface scanning, e.g.:
  #   listening on IPv4 interface em0, 192.0.2.1#53
  #   no longer listening on 192.0.2.1#53
  NAMED_LISTEN_START: 'listening on (?<dns_listen_family>IPv4|IPv6) interface (?<dns_listen_iface>[^,]+), (?<dns_listen_ip>[% IP %])#(?<dns_listen_port>[% INT %])'
  NAMED_LISTEN_STOP: '(?<dns_listen_action>no longer listening) on (?<dns_listen_ip>[% IP %])#(?<dns_listen_port>[% INT %])'
  # Everything else named said. Most of it is the multi-line startup banner --
  # build options, library versions, the ISC contact text -- which has no
  # structure to extract. Matching anything is only safe because the rule is
  # gated on PROGRAM being named.
  NAMED_MESSAGE: '(?<dns_message>.+)'
vars_tests:
  NOTSPACE_NO_SLASH:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'example.com'
        result: 'example.com'
      - string: 'host.sub.test.org'
        result: 'host.sub.test.org'
    negative:
      - 'has a space'
      - 'example.com/IN'
  NOTSPACE_NO_COLON:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: '/usr/local/etc/namedb/master/example.db'
        result: '/usr/local/etc/namedb/master/example.db'
      - string: 'example.com'
        result: 'example.com'
    negative:
      - 'has a space'
      - '/usr/local/etc/namedb/master/example.db:11'
  GREEDYDATA_NO_QUOTE:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'network unreachable'
        result: 'network unreachable'
      - string: 'host unreachable'
        result: 'host unreachable'
    negative:
      - 'has a '' quote'
  NAMED_QUERY:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'client @0x7f8b1c0d5e00 192.0.2.5#54321 (example.com): query: example.com IN A +E(0)K (192.0.2.1)'
        result: 'client @0x7f8b1c0d5e00 192.0.2.5#54321 (example.com): query: example.com IN A +E(0)K (192.0.2.1)'
      - string: 'client 198.51.100.9#40000 (test.org): query: test.org IN AAAA + (192.0.2.1)'
        result: 'client 198.51.100.9#40000 (test.org): query: test.org IN AAAA + (192.0.2.1)'
    negative:
      - 'this is not a named query line at all'
  NAMED_QUERY_DENIED:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'client @0x7f 203.0.113.7#40000 (example.com): query (cache) ''example.com/A/IN'' denied'
        result: 'client @0x7f 203.0.113.7#40000 (example.com): query (cache) ''example.com/A/IN'' denied'
      - string: 'client 198.51.100.9#40000 (test.org): query ''test.org/AAAA/IN'' denied'
        result: 'client 198.51.100.9#40000 (test.org): query ''test.org/AAAA/IN'' denied'
    negative:
      - 'client @0x7f 192.0.2.5#54321 (example.com): query: example.com IN A + (192.0.2.1)'
  NAMED_XFR_CLIENT:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'client 192.0.2.9#5300 (example.com): transfer of ''example.com/IN'': AXFR started'
        result: 'client 192.0.2.9#5300 (example.com): transfer of ''example.com/IN'': AXFR started'
      - string: 'client 192.0.2.9#5300 (example.com): transfer of ''example.com/IN'': AXFR-style IXFR ended'
        result: 'client 192.0.2.9#5300 (example.com): transfer of ''example.com/IN'': AXFR-style IXFR ended'
    negative:
      - 'transfer of ''example.com/IN'' from 192.0.2.2#53: failed while receiving responses: end of file'
  NAMED_XFR_FROM:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'transfer of ''example.com/IN'' from 192.0.2.2#53: failed while receiving responses: end of file'
        result: 'transfer of ''example.com/IN'' from 192.0.2.2#53: failed while receiving responses: end of file'
      - string: 'transfer of ''test.org/IN'' from 198.51.100.9#53: connected using 192.0.2.1#5300'
        result: 'transfer of ''test.org/IN'' from 198.51.100.9#53: connected using 192.0.2.1#5300'
    negative:
      - 'client 192.0.2.9#5300 (example.com): transfer of ''example.com/IN'': AXFR started'
  NAMED_ZONE_LOAD:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'zone example.com/IN: loaded serial 2024010101'
        result: 'zone example.com/IN: loaded serial 2024010101'
      - string: 'zone test.org/IN: loaded serial 1'
        result: 'zone test.org/IN: loaded serial 1'
    negative:
      - 'zone example.com/IN: sending notifies (serial 2024010101)'
  NAMED_DNSSEC:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'validating example.com/A: no valid signature found'
        result: 'validating example.com/A: no valid signature found'
      - string: 'validating example.com/A: insecurity proof failed'
        result: 'validating example.com/A: insecurity proof failed'
    negative:
      - 'zone example.com/IN: loaded serial 2024010101'
  NAMED_RRL:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'client 203.0.113.7#40000 (example.com): rate limit slip response to 203.0.113.0/24 for example.com IN A  (abcd1234)'
        result: 'client 203.0.113.7#40000 (example.com): rate limit slip response to 203.0.113.0/24 for example.com IN A  (abcd1234)'
      - string: 'client 203.0.113.7#40000 (example.com): rate limit drop responses to 203.0.113.0/24 for example.com IN A  (abcd1234)'
        result: 'client 203.0.113.7#40000 (example.com): rate limit drop responses to 203.0.113.0/24 for example.com IN A  (abcd1234)'
    negative:
      - 'client @0x7f 192.0.2.5#54321 (example.com): query: example.com IN A + (192.0.2.1)'
  NAMED_DDNS:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'client 192.0.2.9#40000: updating zone ''example.com/IN'': adding an RR at ''host.example.com'' A 192.0.2.50'
        result: 'client 192.0.2.9#40000: updating zone ''example.com/IN'': adding an RR at ''host.example.com'' A 192.0.2.50'
      - string: 'client 192.0.2.9#40000: updating zone ''test.org/IN'': deleting rrset at ''host.test.org'' A'
        result: 'client 192.0.2.9#40000: updating zone ''test.org/IN'': deleting rrset at ''host.test.org'' A'
    negative:
      - 'client @0x7f 192.0.2.5#54321 (example.com): query: example.com IN A + (192.0.2.1)'
  NAMED_LAME:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'lame server resolving ''example.com'' (in ''example.com''?): 192.0.2.2#53'
        result: 'lame server resolving ''example.com'' (in ''example.com''?): 192.0.2.2#53'
      - string: 'lame server resolving ''sub.test.org'' (in ''test.org''?): 198.51.100.9#53'
        result: 'lame server resolving ''sub.test.org'' (in ''test.org''?): 198.51.100.9#53'
    negative:
      - 'network unreachable resolving ''example.com/A/IN'': 2001:db8::1#53'
  NAMED_NET_ERROR:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'network unreachable resolving ''example.com/A/IN'': 2001:db8::1#53'
        result: 'network unreachable resolving ''example.com/A/IN'': 2001:db8::1#53'
      - string: 'host unreachable resolving ''test.org/AAAA/IN'': 192.0.2.2#53'
        result: 'host unreachable resolving ''test.org/AAAA/IN'': 192.0.2.2#53'
    negative:
      - 'lame server resolving ''example.com'' (in ''example.com''?): 192.0.2.2#53'
  NAMED_RCODE_ERROR:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'REFUSED unexpected RCODE resolving ''example.com/A/IN'': 192.0.2.2#53'
        result: 'REFUSED unexpected RCODE resolving ''example.com/A/IN'': 192.0.2.2#53'
      - string: 'SERVFAIL unexpected RCODE resolving ''test.org/AAAA/IN'': 198.51.100.9#53'
        result: 'SERVFAIL unexpected RCODE resolving ''test.org/AAAA/IN'': 198.51.100.9#53'
    negative:
      - 'network unreachable resolving ''example.com/A/IN'': 2001:db8::1#53'
  NAMED_QNAME_MIN:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'success resolving ''example.com/A'' after disabling qname minimization due to ''ncache nxdomain'''
        result: 'success resolving ''example.com/A'' after disabling qname minimization due to ''ncache nxdomain'''
