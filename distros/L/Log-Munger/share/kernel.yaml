            kernel_apparmor_mode: 'ALLOWED'
            kernel_audit_epoch: '1700000000.000'
            kernel_audit_id: '1700000000.000:97'
            kernel_audit_serial: '97'
            kernel_audit_type: '1502'
            mac_result: 'ALLOWED'
          enriched:
