  # ---- FreeBSD vars_tests ----
  KERNEL_FBSD_SIGEXIT:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'pid 48822 (httpd), jid 0, uid 80: exited on signal 11 (core dumped)'
        result: 'pid 48822 (httpd), jid 0, uid 80: exited on signal 11 (core dumped)'
      - string: 'pid 512 (sshd), jid 0, uid 0: exited on signal 6'
        result: 'pid 512 (sshd), jid 0, uid 0: exited on signal 6'
    negative:
      - 'pid 1234 (mysqld), jid 0, uid 88, was killed: out of swap space'
  KERNEL_FBSD_SWAPKILL:
