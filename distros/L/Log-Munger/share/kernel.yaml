  KERNEL_LINUX_LL_HEADER:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'll header: 00000000: ff ff ff ff ff ff c4 d8 d5 3b 8c 4b 08 00'
