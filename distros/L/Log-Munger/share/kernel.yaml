        result: 'IPv4: martian source 192.0.2.1 from 10.0.0.1, on dev eth0'
      - string: 'martian source 192.0.2.1 from 10.0.0.1, on dev eth0'
        result: 'martian source 192.0.2.1 from 10.0.0.1, on dev eth0'
      - string: 'IPv4: martian destination 224.0.0.1 from 10.0.0.1, dev eth0'
