# The martian source is the only remote address this file captures. It is
# looked up for the same reason netfilter.yaml looks up a dropped packet's
# source, and with the same caveat: an address the stack called impossible may
# well be spoofed, so the answer is evidence about the packet rather than about
# whoever really sent it.
geoip:
  - kernel_martian_src_ip
convert:
  kernel_oom_pid: int
  kernel_bridge_port: int
  kernel_segv_pid: int
  kernel_trap_pid: int
  kernel_io_sector: int
  kernel_apparmor_pid: int
  kernel_apparmor_fsuid: int
  kernel_apparmor_ouid: int
  kernel_apparmor_error: int
  kernel_apparmor_capability: int
  kernel_apparmor_peer_pid: int
  kernel_audit_serial: int
  kernel_audit_type: int
  kernel_audit_epoch: float
  kernel_syn_port: int
  kernel_ratelimit_suppressed: int
  # The two halves of the link-layer header dump, printed by the kernel as
  # space-separated hex and rewritten here into the colon-separated form the
  # other MAC captures in this file use.
  kernel_ll_dst_mac: mac
  kernel_ll_src_mac: mac
  # Normalized LSM verdict, shared with share/auditd.yaml. AppArmor writes
  # "DENIED" where SELinux writes "denied", so the case is folded.
  mac_result: lc
  # FreeBSD numeric top-level captures.
  kernel_pid: int
  kernel_uid: int
  kernel_jid: int
  kernel_signal: int
  kernel_limit_from: int
  kernel_limit_to: int
  kernel_listenq_depth: int
  kernel_listenq_occurrences: int
  kernel_geom_error: int
  kernel_trap_num: int
  # The CAM address a peripheral attached at.
  kernel_cam_bus: int
  kernel_cam_scbus: int
  kernel_cam_target: int
  kernel_cam_lun: int
  # Where on the bus a departing newbus device had been.
  kernel_usb_port: int
  kernel_usb_addr: int
  kernel_linux_prctl_option: int
  # Boot-probe disk and enclosure geometry.
  kernel_disk_size_mb: int
  kernel_disk_sectors: int
  kernel_disk_sector_bytes: int
  kernel_disk_speed_mbs: float
  kernel_ses_phy: int
  kernel_ses_phys: int
  kernel_ses_slot_num: int
  # Capability announcements.
  kernel_hub_ports: int
  kernel_hub_removable: int
  kernel_hid_buttons: int
  kernel_hid_report_id: int
  kernel_audio_index: int
  kernel_audio_rate: int
  kernel_audio_channels: int
# Break the quoted apparmor key=value tail into individual kernel_apparmor_*
# fields. Values are double-quoted, so the split is quote-aware and strips
# them. The pattern captures the mode ("DENIED") separately as
# kernel_apparmor_mode; operation, profile, name and comm map 1:1 here.
decompose:
  # Pull the USB_ERR_* code out of whichever position the message put it in.
  # The one phrasing that carries no code leaves the detail untouched.
  - field: kernel_usb_error_detail
    type: pattern
    pattern: KERNEL_USB_ERR_CODE
    tests:
      - input: 'device problem (USB_ERR_IOERROR), disabling port 2'
        result:
          kernel_usb_error_detail: 'device problem (USB_ERR_IOERROR), disabling port 2'
          kernel_usb_error: 'USB_ERR_IOERROR'
      - input: 'addr=80, port reset failed, USB_ERR_IOERROR'
        result:
          kernel_usb_error_detail: 'addr=80, port reset failed, USB_ERR_IOERROR'
          kernel_usb_error: 'USB_ERR_IOERROR'
      # no code in this one, so nothing is split out
      - input: 'could not allocate new device'
        result:
          kernel_usb_error_detail: 'could not allocate new device'
  - field: kernel_apparmor_kv
    type: kv
    quoted: true
    prefix: 'kernel_apparmor_'
    remove: true
    tests:
      - input: 'operation="open" profile="/usr/bin/foo" name="/etc/shadow" pid=1234 comm="foo" requested_mask="r" denied_mask="r" fsuid=0 ouid=0'
        result:
          kernel_apparmor_operation: 'open'
          kernel_apparmor_profile: '/usr/bin/foo'
          kernel_apparmor_name: '/etc/shadow'
          kernel_apparmor_pid: '1234'
          kernel_apparmor_comm: 'foo'
          kernel_apparmor_requested_mask: 'r'
          kernel_apparmor_denied_mask: 'r'
          kernel_apparmor_fsuid: '0'
          kernel_apparmor_ouid: '0'
  # Split an Ethernet link-layer header dump into its three parts. Fires only
  # when the dump is exactly 14 bytes; any other link type leaves
  # kernel_ll_header untouched.
  - field: kernel_ll_header
    type: pattern
    pattern: KERNEL_LL_ETHERNET
    tests:
      - input: 'ff ff ff ff ff ff c4 d8 d5 3b 8c 4b 08 00'
        result:
          kernel_ll_header: 'ff ff ff ff ff ff c4 d8 d5 3b 8c 4b 08 00'
          kernel_ll_dst_mac: 'ff ff ff ff ff ff'
          kernel_ll_src_mac: 'c4 d8 d5 3b 8c 4b'
          kernel_ll_ethertype: '08 00'
      # Not Ethernet, so nothing is split out.
      - input: 'ff ff ff ff ff ff c4 d8'
        result:
          kernel_ll_header: 'ff ff ff ff ff ff c4 d8'
rules:
  - name: kernel
    gate:
      - field: PROGRAM
        values:
          - '//^kernel$//'
    field: MESSAGE
    anchored: true
    patterns:
      - KERNEL_LINUX_OOM
      - KERNEL_LINUX_OOM_OLD
      - KERNEL_LINUX_SEGV
      - KERNEL_LINUX_TRAP
      - KERNEL_LINUX_EXT_FS
      - KERNEL_LINUX_XFS
      - KERNEL_LINUX_BLK_IO
      - KERNEL_LINUX_APPARMOR
      - KERNEL_LINUX_USB
      - KERNEL_LINUX_SYNFLOOD
      - KERNEL_LINUX_CONNTRACK_FULL
      - KERNEL_LINUX_MARTIAN
      - KERNEL_LINUX_BRIDGE_PORT
      - KERNEL_LINUX_NETDEV_MODE
      - KERNEL_LINUX_LINK
      - KERNEL_LINUX_BRIDGE_TOPOLOGY
      - KERNEL_LINUX_LL_HEADER
      - KERNEL_LINUX_RATELIMIT
      # ---- FreeBSD patterns (appended after the Linux ones) ----
      - KERNEL_FBSD_SIGEXIT
      - KERNEL_FBSD_SWAPKILL
      - KERNEL_FBSD_SWAPFAIL
      - KERNEL_FBSD_SWAPOUT
      - KERNEL_FBSD_LIMIT
      - KERNEL_FBSD_LISTENQ
      - KERNEL_FBSD_ARP
      - KERNEL_FBSD_CAM
      - KERNEL_FBSD_DISK
      - KERNEL_FBSD_GEOM_IO
      - KERNEL_FBSD_GEOM_EVENT
      - KERNEL_FBSD_ZFS_MSG
      - KERNEL_FBSD_ZFS_VDEV
      - KERNEL_FBSD_UGEN
      - KERNEL_FBSD_CAM_ATTACH
      - KERNEL_FBSD_LINK
      # newbus after CAM_ATTACH and LINK, both of which it would otherwise
      # shadow; GONE and DETACH before the two attach forms
      - KERNEL_FBSD_NEWBUS_GONE
      - KERNEL_FBSD_NEWBUS_DETACH
      - KERNEL_FBSD_NEWBUS_ATTACH_DESC
      # the probe form last of the attach patterns: it is the same shape with a
      # resource clause, so the plainer one gets first refusal
      - KERNEL_FBSD_PROBE_ATTACH
      - KERNEL_FBSD_NEWBUS_ATTACH
      # ---- boot probe detail, all keyed on a peripheral name ----
      - KERNEL_FBSD_SES_SLOT
      - KERNEL_FBSD_SES_PHY
      - KERNEL_FBSD_PROBE_IDENT
      - KERNEL_FBSD_DISK_SERIAL
      - KERNEL_FBSD_DISK_SIZE
      - KERNEL_FBSD_DISK_SPEED
      - KERNEL_FBSD_DISK_ATTR
      # ---- capability announcements ----
      - KERNEL_FBSD_HUB_PORTS
      - KERNEL_FBSD_HUB_MTT
      - KERNEL_FBSD_HID_MOUSE
      - KERNEL_FBSD_UAUDIO_FORMAT
      # function-prefixed, so it cannot collide with the device-prefixed ones
      - KERNEL_FBSD_USB_ERROR
      # specific Linuxulator messages before the catch-all
      - KERNEL_FBSD_LINUX_PRCTL
      - KERNEL_FBSD_LINUX_SYSCALL
      - KERNEL_FBSD_LINUX
      - KERNEL_FBSD_PANIC
      - KERNEL_FBSD_FATAL_TRAP
    tests:
      positive:
        # -- Linux message types --
        # [Linux] KERNEL_LINUX_OOM
        - string: 'Out of memory: Killed process 1234 (mysqld) total-vm:100kB, anon-rss:50kB, file-rss:0kB, shmem-rss:0kB, UID:999 pgtables:1kB oom_score_adj:0'
          numeric:
            - kernel_oom_pid
          result:
            kernel_oom_pid: '1234'
            kernel_oom_process: 'mysqld'
            kernel_oom_total_vm: '100kB'
            kernel_oom_anon_rss: '50kB'
        # [Linux] KERNEL_LINUX_OOM_OLD
        - string: 'Killed process 1234 (mysqld) total-vm:100kB, anon-rss:50kB, file-rss:0kB, shmem-rss:0kB'
          result:
            kernel_oom_pid: '1234'
            kernel_oom_process: 'mysqld'
            kernel_oom_total_vm: '100kB'
            kernel_oom_anon_rss: '50kB'
        # [Linux] KERNEL_LINUX_SEGV
        - string: 'php[12345]: segfault at 0 ip 00007f00 sp 00007ffe error 4 in libc-2.31.so[7f00+1c000]'
          numeric:
            - kernel_segv_pid
          result:
            kernel_segv_comm: 'php'
            kernel_segv_pid: '12345'
            kernel_segv_addr: '0'
            kernel_segv_ip: '00007f00'
            kernel_segv_sp: '00007ffe'
            kernel_segv_error: '4'
        # [Linux] KERNEL_LINUX_TRAP
        - string: 'traps: nginx[1234] general protection ip:00007f00 sp:00007ffe error:0 in libc-2.31.so[7f00+1c000]'
          numeric:
            - kernel_trap_pid
          result:
            kernel_trap_comm: 'nginx'
            kernel_trap_pid: '1234'
            kernel_trap_detail: 'general protection ip:00007f00 sp:00007ffe error:0 in libc-2.31.so[7f00+1c000]'
        # [Linux] KERNEL_LINUX_EXT_FS
        - string: 'EXT4-fs error (device sda1): ext4_find_entry:1234: inode #2: comm ls: reading directory lblock 0'
          result:
            kernel_fs: 'EXT4-fs'
            kernel_device: 'sda1'
            kernel_fs_detail: 'ext4_find_entry:1234: inode #2: comm ls: reading directory lblock 0'
        # [Linux] KERNEL_LINUX_XFS
        - string: 'XFS (sda1): Metadata corruption detected at xfs_agf_read_verify+0x90, xfs_agf block 0x1'
          result:
            kernel_fs: 'XFS'
            kernel_device: 'sda1'
            kernel_fs_detail: 'Metadata corruption detected at xfs_agf_read_verify+0x90, xfs_agf block 0x1'
        # [Linux] KERNEL_LINUX_BLK_IO
        - string: 'blk_update_request: I/O error, dev sda, sector 12345678 op 0x0:(READ) flags 0x0 phys_seg 1 prio class 0'
          numeric:
            - kernel_io_sector
          result:
            kernel_io_dev: 'sda'
            kernel_io_sector: '12345678'
        # [Linux] KERNEL_LINUX_APPARMOR
        - string: 'audit: type=1400 audit(1626345600.123:456): apparmor="DENIED" operation="open" profile="/usr/bin/foo" name="/etc/shadow" pid=1234 comm="foo" requested_mask="r" denied_mask="r" fsuid=0 ouid=0'
          enriched:
            kernel_apparmor_comm: 'foo'
            kernel_apparmor_denied_mask: 'r'
            kernel_apparmor_fsuid: '0'
            kernel_apparmor_mode: 'DENIED'
            kernel_apparmor_name: '/etc/shadow'
            kernel_apparmor_operation: 'open'
            kernel_apparmor_ouid: '0'
            kernel_apparmor_pid: '1234'
            kernel_apparmor_profile: '/usr/bin/foo'
            kernel_apparmor_requested_mask: 'r'
            kernel_audit_epoch: '1626345600.123'
            kernel_audit_id: '1626345600.123:456'
            kernel_audit_serial: '456'
            kernel_audit_type: '1400'
            mac_result: 'denied'
          numeric:
            - kernel_apparmor_fsuid
            - kernel_apparmor_ouid
            - kernel_apparmor_pid
            - kernel_audit_epoch
            - kernel_audit_serial
            - kernel_audit_type
          program: 'kernel'
          result:
            kernel_audit_type: '1400'
            kernel_audit_id: '1626345600.123:456'
            kernel_audit_epoch: '1626345600.123'
            kernel_audit_serial: '456'
            mac_result: 'DENIED'
            kernel_apparmor_mode: 'DENIED'
            kernel_apparmor_kv: 'operation="open" profile="/usr/bin/foo" name="/etc/shadow" pid=1234 comm="foo" requested_mask="r" denied_mask="r" fsuid=0 ouid=0'
        # [Linux] KERNEL_LINUX_APPARMOR, profile-load failure: no operation=,
        # which the previous pattern required and therefore never matched
        - string: 'audit: type=1400 audit(1700000000.000:100): apparmor="STATUS" info="failed to unpack profile" error=-71 profile="unconfined" pid=123 comm="apparmor_parser"'
          enriched:
            kernel_apparmor_comm: 'apparmor_parser'
            kernel_apparmor_error: '-71'
            kernel_apparmor_info: 'failed to unpack profile'
            kernel_apparmor_mode: 'STATUS'
            kernel_apparmor_pid: '123'
            kernel_apparmor_profile: 'unconfined'
            kernel_audit_epoch: '1700000000'
            kernel_audit_id: '1700000000.000:100'
            kernel_audit_serial: '100'
            kernel_audit_type: '1400'
            mac_result: 'status'
          numeric:
            - kernel_apparmor_error
          result:
            kernel_audit_type: '1400'
            kernel_audit_id: '1700000000.000:100'
            kernel_audit_epoch: '1700000000.000'
            kernel_audit_serial: '100'
            mac_result: 'STATUS'
            kernel_apparmor_mode: 'STATUS'
            kernel_apparmor_kv: 'info="failed to unpack profile" error=-71 profile="unconfined" pid=123 comm="apparmor_parser"'
        # [Linux] KERNEL_LINUX_APPARMOR wearing the printk uptime. The captures
        # and the decompose have to come out identical to the stripped shape
        # above, since the prefix is stepped over rather than captured.
        - string: '[ 9134.220118] audit: type=1400 audit(1626345600.123:456): apparmor="DENIED" operation="open" profile="/usr/bin/foo" name="/etc/shadow" pid=1234 comm="foo" requested_mask="r" denied_mask="r" fsuid=0 ouid=0'
          result:
            kernel_audit_type: '1400'
            kernel_audit_id: '1626345600.123:456'
            kernel_audit_epoch: '1626345600.123'
            kernel_audit_serial: '456'
            mac_result: 'DENIED'
            kernel_apparmor_mode: 'DENIED'
            kernel_apparmor_kv: 'operation="open" profile="/usr/bin/foo" name="/etc/shadow" pid=1234 comm="foo" requested_mask="r" denied_mask="r" fsuid=0 ouid=0'
        # [Linux] KERNEL_LINUX_USB
        - string: 'usb 1-1: new high-speed USB device number 5 using ehci-hcd'
          result:
            kernel_usb: '1-1'
        # [Linux] KERNEL_LINUX_SYNFLOOD
        - string: 'TCP: request_sock_TCP: Possible SYN flooding on port 80. Sending cookies.  Check SNMP counters.'
          numeric:
            - kernel_syn_port
          result:
            kernel_syn_port: '80'
            kernel_syn_action: 'cookies'
        - string: 'TCP: Possible SYN flooding on port [::ffff:192.0.2.1]:80. Sending cookies.'
          result:
            kernel_syn_local_addr: '::ffff:192.0.2.1'
            kernel_syn_port: '80'
            kernel_syn_action: 'cookies'
        # [Linux] KERNEL_LINUX_CONNTRACK_FULL
        - string: 'nf_conntrack: nf_conntrack: table full, dropping packet'
          result:
            kernel_conntrack_module: 'nf_conntrack'
        - string: 'ip_conntrack: table full, dropping packet.'
          result:
            kernel_conntrack_module: 'ip_conntrack'
        # [Linux] KERNEL_LINUX_MARTIAN. The kernel prints the destination first
        # even though the sentence reads "source", so both are checked against
        # the field named for what they are.
        - string: 'IPv4: martian source 192.0.2.1 from 10.0.0.1, on dev eth0'
          result:
            kernel_martian_kind: 'source'
            kernel_martian_dst_ip: '192.0.2.1'
            kernel_martian_src_ip: '10.0.0.1'
            kernel_martian_iface: 'eth0'
        - string: 'IPv4: martian destination 224.0.0.1 from 10.0.0.1, dev eth0'
          result:
            kernel_martian_kind: 'destination'
            kernel_martian_dst_ip: '224.0.0.1'
            kernel_martian_src_ip: '10.0.0.1'
            kernel_martian_iface: 'eth0'
        # [Linux] KERNEL_LINUX_LL_HEADER, the continuation line of the martian
        # above. Only raw captures are asserted here: splitting the header into
        # its two MACs is decompose's job and rewriting them into colon form is
        # convert's, and neither has run at this point. The decompose test
        # above covers the split, and t/rule_gaps.t covers the pair end to end.
        - string: 'll header: 00000000: ff ff ff ff ff ff c4 d8 d5 3b 8c 4b 08 00'
          enriched:
            kernel_ll_dst_mac: 'ff:ff:ff:ff:ff:ff'
            kernel_ll_ethertype: '08 00'
            kernel_ll_header: 'ff ff ff ff ff ff c4 d8 d5 3b 8c 4b 08 00'
            kernel_ll_offset: '00000000'
            kernel_ll_src_mac: 'c4:d8:d5:3b:8c:4b'
          result:
            kernel_ll_offset: '00000000'
            kernel_ll_header: 'ff ff ff ff ff ff c4 d8 d5 3b 8c 4b 08 00'
        # [Linux] KERNEL_LINUX_RATELIMIT
        - string: 'net_ratelimit: 2 callbacks suppressed'
          numeric:
            - kernel_ratelimit_suppressed
          result:
            kernel_ratelimit_source: 'net_ratelimit'
            kernel_ratelimit_suppressed: '2'
        # [Linux] KERNEL_LINUX_BRIDGE_TOPOLOGY
        - string: 'virbr0: topology change detected, propagating'
          result:
            kernel_bridge: 'virbr0'
            kernel_bridge_topology: 'propagating'
        # [Linux] The prefix is not the AppArmor pattern's alone. It rides in
        # front of any Linux ring-buffer message, so a second type is checked
        # to prove it is handled file-wide.
        - string: '[ 1234.567890] Out of memory: Killed process 1234 (mysqld) total-vm:100kB, anon-rss:50kB, file-rss:0kB, shmem-rss:0kB, UID:999 pgtables:1kB oom_score_adj:0'
          result:
            kernel_oom_pid: '1234'
            kernel_oom_process: 'mysqld'
            kernel_oom_total_vm: '100kB'
            kernel_oom_anon_rss: '50kB'
        - string: '[ 1234.567890] blk_update_request: I/O error, dev sda, sector 12345678 op 0x0:(READ) flags 0x0 phys_seg 1 prio class 0'
          result:
            kernel_io_dev: 'sda'
            kernel_io_sector: '12345678'
        # -- FreeBSD message types --
        # [FreeBSD] KERNEL_FBSD_SIGEXIT
        - string: 'pid 48822 (httpd), jid 0, uid 80: exited on signal 11 (core dumped)'
          numeric:
            - kernel_jid
            - kernel_pid
            - kernel_signal
            - kernel_uid
          result:
            kernel_pid: '48822'
            kernel_comm: 'httpd'
            kernel_jid: '0'
            kernel_uid: '80'
            kernel_signal: '11'
            kernel_core: 'core dumped'
        # [FreeBSD] KERNEL_FBSD_SIGEXIT
        - string: 'pid 512 (sshd), jid 0, uid 0: exited on signal 6'
          result:
            kernel_pid: '512'
            kernel_comm: 'sshd'
            kernel_jid: '0'
            kernel_uid: '0'
            kernel_signal: '6'
        # [FreeBSD] KERNEL_FBSD_SWAPKILL
        - string: 'pid 1234 (mysqld), jid 0, uid 88, was killed: out of swap space'
          result:
            kernel_pid: '1234'
            kernel_comm: 'mysqld'
            kernel_jid: '0'
            kernel_uid: '88'
            kernel_kill_reason: 'out of swap space'
        # [FreeBSD] KERNEL_FBSD_SWAPFAIL
        - string: 'swp_pager_getswapspace(16): failed'
          result:
            kernel_swap_count: '16'
        # [FreeBSD] KERNEL_FBSD_LIMIT
        - string: 'Limiting closed port RST response from 400 to 200 packets/sec'
          numeric:
            - kernel_limit_from
            - kernel_limit_to
          result:
            kernel_limit_type: 'closed port RST'
            kernel_limit_from: '400'
            kernel_limit_to: '200'
        # [FreeBSD] KERNEL_FBSD_LIMIT
        - string: 'Limiting icmp unreach response from 200 to 100 packets/sec'
          result:
            kernel_limit_type: 'icmp unreach'
            kernel_limit_from: '200'
            kernel_limit_to: '100'
        # [FreeBSD] KERNEL_FBSD_LISTENQ
        - string: 'sonewconn: pcb 0xfffff800: Listen queue overflow: 193 already in queue awaiting acceptance (5 occurrences)'
          numeric:
            - kernel_listenq_depth
            - kernel_listenq_occurrences
          result:
            kernel_listenq_pcb: '0xfffff800'
            kernel_listenq_depth: '193'
            kernel_listenq_occurrences: '5'
        # [FreeBSD] KERNEL_FBSD_ARP
        - string: 'arp: 192.0.2.5 moved from aa:bb:cc:dd:ee:ff to 11:22:33:44:55:66 on em0'
          result:
            kernel_arp_ip: '192.0.2.5'
            kernel_arp_from_mac: 'aa:bb:cc:dd:ee:ff'
            kernel_arp_to_mac: '11:22:33:44:55:66'
            kernel_arp_iface: 'em0'
        # [FreeBSD] KERNEL_FBSD_CAM
        - string: '(ada0:ahcich0:0:0:0): CAM status: Command timeout'
          result:
            kernel_cam_device: 'ada0:ahcich0:0:0:0'
            kernel_cam_status: 'Command timeout'
        # [FreeBSD] KERNEL_FBSD_DISK
        - string: 'ada0: FAILURE - READ_DMA48. ACB: 25 00 00 00 00 40 00 00 00 00 00 00'
          result:
            kernel_disk: 'ada0'
            kernel_disk_failure: 'READ_DMA48. ACB: 25 00 00 00 00 40 00 00 00 00 00 00'
        # [FreeBSD] KERNEL_FBSD_GEOM_IO
        - string: 'g_vfs_done():ada0p2[READ(offset=12345, length=4096)]error = 5'
          numeric:
            - kernel_geom_error
          result:
            kernel_geom_provider: 'ada0p2'
            kernel_geom_op: 'READ'
            kernel_geom_error: '5'
        # [FreeBSD] KERNEL_FBSD_GEOM_EVENT
        - string: 'GEOM_MIRROR: Device gm0: provider ada1 disconnected.'
          result:
            kernel_geom_class: 'GEOM_MIRROR'
            kernel_geom_message: 'Device gm0: provider ada1 disconnected.'
        # [FreeBSD] KERNEL_FBSD_GEOM_EVENT
        - string: 'GEOM_ELI: Device ada0p3.eli created.'
          result:
            kernel_geom_class: 'GEOM_ELI'
            kernel_geom_message: 'Device ada0p3.eli created.'
        # [FreeBSD] KERNEL_FBSD_ZFS_MSG
        - string: "Solaris: WARNING: Pool 'tank' has encountered an uncorrectable I/O failure and has been suspended."
          result:
            kernel_zfs_message: "WARNING: Pool 'tank' has encountered an uncorrectable I/O failure and has been suspended."
        # [FreeBSD] KERNEL_FBSD_ZFS_VDEV
        - string: 'ZFS: vdev state changed, pool_guid=123 vdev_guid=456'
          result:
            kernel_zfs_pool_guid: '123'
            kernel_zfs_vdev_guid: '456'
        # [FreeBSD] KERNEL_FBSD_UGEN
        - string: 'ugen0.3: <vendor product> at usbus0'
          result:
            kernel_usb_dev: 'ugen0.3'
            kernel_usb_desc: 'vendor product'
            kernel_usb_bus: 'usbus0'
        # [FreeBSD] KERNEL_FBSD_UGEN, the departure half of the same pair. The
        # only difference from the arrival above is kernel_usb_state.
        - string: 'ugen0.3: <vendor product> at usbus0 (disconnected)'
          result:
            kernel_usb_dev: 'ugen0.3'
            kernel_usb_desc: 'vendor product'
            kernel_usb_bus: 'usbus0'
            kernel_usb_state: 'disconnected'
        # [FreeBSD] KERNEL_FBSD_CAM_ATTACH
        - string: 'da0 at umass-sim0 bus 0 scbus0 target 0 lun 0'
          numeric:
            - kernel_cam_bus
            - kernel_cam_lun
            - kernel_cam_scbus
            - kernel_cam_target
          result:
            kernel_cam_periph: 'da0'
            kernel_cam_sim: 'umass-sim0'
            kernel_cam_bus: '0'
            kernel_cam_scbus: '0'
            kernel_cam_target: '0'
            kernel_cam_lun: '0'
        # [FreeBSD] KERNEL_FBSD_CAM_ATTACH behind a SAS HBA rather than umass,
        # which is the case the usb-named captures used to mislabel.
        - string: 'da0 at mps0 bus 0 scbus8 target 61 lun 0'
          result:
            kernel_cam_periph: 'da0'
            kernel_cam_sim: 'mps0'
            kernel_cam_bus: '0'
            kernel_cam_scbus: '8'
            kernel_cam_target: '61'
            kernel_cam_lun: '0'
        # [FreeBSD] KERNEL_FBSD_NEWBUS_ATTACH_DESC
        - string: 'hidbus3: <HID bus> on usbhid3'
          result:
            kernel_newbus_device: 'hidbus3'
            kernel_newbus_desc: 'HID bus'
            kernel_newbus_parent: 'usbhid3'
        # [FreeBSD] KERNEL_FBSD_NEWBUS_ATTACH
        - string: 'usbhid3 on uhub7'
          result:
            kernel_newbus_device: 'usbhid3'
            kernel_newbus_parent: 'uhub7'
        # [FreeBSD] KERNEL_FBSD_NEWBUS_ATTACH, the "at" spelling
        - string: 'kbd2 at hkbd0'
          result:
            kernel_newbus_device: 'kbd2'
            kernel_newbus_parent: 'hkbd0'
        # [FreeBSD] KERNEL_FBSD_NEWBUS_GONE
        - string: 'usbhid3: at uhub7, port 2, addr 80 (disconnected)'
          numeric:
            - kernel_usb_addr
            - kernel_usb_port
          result:
            kernel_newbus_device: 'usbhid3'
            kernel_newbus_parent: 'uhub7'
            kernel_usb_port: '2'
            kernel_usb_addr: '80'
            kernel_newbus_state: 'disconnected'
        # [FreeBSD] KERNEL_FBSD_NEWBUS_DETACH
        - string: 'usbhid3: detached'
          result:
            kernel_newbus_device: 'usbhid3'
            kernel_newbus_state: 'detached'
        # [FreeBSD] KERNEL_FBSD_LINUX_PRCTL
        - string: 'linux: jid 0 pid 4242 (claude): unsupported prctl option 59'
          numeric:
            - kernel_linux_prctl_option
          result:
            kernel_jid: '0'
            kernel_pid: '4242'
            kernel_comm: 'claude'
            kernel_linux_prctl_option: '59'
        # [FreeBSD] KERNEL_FBSD_LINUX_SYSCALL, no jid, comm with a space
        - string: 'linux: pid 4242 (Bun Pool 1): syscall pidfd_open not implemented'
          result:
            kernel_pid: '4242'
            kernel_comm: 'Bun Pool 1'
            kernel_linux_syscall: 'pidfd_open'
        # [FreeBSD] KERNEL_FBSD_LINUX
        - string: 'linux: jid 0 pid 4242 (claude): unsupported ioctl TIOCGPTPEER'
          result:
            kernel_jid: '0'
            kernel_pid: '4242'
            kernel_comm: 'claude'
            kernel_linux_message: 'unsupported ioctl TIOCGPTPEER'
        # [FreeBSD] KERNEL_FBSD_LINUX catching spliced kernel output: the
        # leading fragment still parses, no option number is invented.
        - string: 'linux: jid 0 pid 41 (claude): unsupported prctl option 42unsupported prctl option 59'
          result:
            kernel_jid: '0'
            kernel_pid: '41'
            kernel_comm: 'claude'
            kernel_linux_message: 'unsupported prctl option 42unsupported prctl option 59'
        # [FreeBSD] KERNEL_FBSD_LINK
        - string: 'em0: link state changed to DOWN'
          result:
            kernel_iface: 'em0'
            kernel_link_state: 'DOWN'
        # [FreeBSD] KERNEL_FBSD_LINK
        - string: 'igb1: link state changed to UP'
          result:
            kernel_iface: 'igb1'
            kernel_link_state: 'UP'
        # [FreeBSD] KERNEL_FBSD_PANIC
        - string: 'panic: page fault'
          result:
            kernel_panic: 'page fault'
        # [FreeBSD] KERNEL_FBSD_FATAL_TRAP
        - string: 'Fatal trap 12: page fault while in kernel mode'
          numeric:
            - kernel_trap_num
          result:
            kernel_trap_num: '12'
            kernel_trap_desc: 'page fault while in kernel mode'
        - string: '[ 4391.338436] br-lan: port 10(phy0-ap2) entered disabled state'
