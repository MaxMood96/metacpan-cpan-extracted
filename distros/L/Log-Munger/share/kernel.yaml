            kernel_iface: 'eth0'
            kernel_link_state: 'Up'
            kernel_link_speed: '1Gbps'
            kernel_link_duplex: 'Full'
            kernel_link_flow_control: 'rx/tx'
        # the 1500-range APPARMOR_* types, whose kv carries a capability rather than a path
        - string: 'audit: type=1502 audit(1700000000.000:97): apparmor="ALLOWED" operation="capable" profile="/usr/sbin/nginx" pid=4321 comm="nginx" capability=12 capname="net_admin"'
