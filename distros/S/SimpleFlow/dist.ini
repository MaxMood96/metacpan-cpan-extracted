[@Basic]
[VersionFromModule]
[MetaJSON]

; the "provides" map in META.yml/META.json: which module each package lives in,
; and at what version. CPANTS looks for it (meta_yml_has_provides), and PAUSE
; indexes from it rather than guessing by scanning the tarball.
[MetaProvides::Package]

[Prereqs]
perl            = 5.010
autodie         = 0
Capture::Tiny   = 0
Cwd             = 0
Data::Printer   = 0
Devel::Confess  = 0
Devel::Size     = 0
File::Temp      = 0
List::Util      = 0
POSIX           = 0
Scalar::Util    = 0
Test::Exception = 0
Time::HiRes     = 0
Test::More      = 0
[MetaResources]
repository.web = https://github.com/hhg7/SimpleFlow
repository.url = git://github.com/hhg7/SimpleFlow
repository.type = git
bugtracker.web = https://github.com/hhg7/SimpleFlow/issues
homepage = https://metacpan.org/dist/SimpleFlow
