# ApiKeyDemo configuration. Safe to commit: secrets are referenced here,
# never written here.
#
# The views, the static mount, the database and the models live here. The
# session, `auth` and `plugin 'APIKey'` live in lib/ApiKeyDemo.pm instead,
# and for a reason worth knowing: a plugin declared in this file registers
# at the point the `config` keyword sits, which is before `auth` has
# declared its rank ladder - and APIKey's `scope_rank` is measured against
# that ladder. Declaring it in code puts it after `auth`, where it belongs.

views:
  Stencil:
    template_dir: root/templates
    wrapper: layout.tmpl

static:
  /static: root/static

# SQLite, in a file the schema is deployed into by `punk sqitch deploy`.
# A real application changes this dsn and nothing else: the models, the
# plugin and its shipped api_keys table do not know which engine they are on.
database:
  dsn: dbi:SQLite:dbname=var/apikeydemo.db

# ApiKey is deliberately absent. The application declares no model by that
# name, so the plugin registers the Punk::Model::ApiKey it ships - which is
# the path most applications want and the one worth demonstrating.
models: [ User, Note ]

# Single-use tokens over the session for every POST here. The forms print
# `{% raw csrf %}` and each render passes `csrf => $c->csrf_field` - it is
# not injected automatically, because copying it into every render hashref
# would put a cost on the pages that have no form.
csrf: true
