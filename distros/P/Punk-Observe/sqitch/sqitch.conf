# Two engines, two top directories.
#
# The shipped change is PostgreSQL and the default runtime path is SQLite, so
# one script cannot serve both: BIGSERIAL and JSONB have no SQLite spelling,
# and INTEGER PRIMARY KEY AUTOINCREMENT has no PostgreSQL one. Writing to the
# subset both accept would constrain every future change to it.
#
# So each engine has its own project directory, and a test asserts the two
# build the same tables and columns.
[core]
	engine = sqlite

[engine "pg"]
	top_dir = pg
	plan_file = pg/sqitch.plan

[engine "sqlite"]
	top_dir = sqlite
	plan_file = sqlite/sqitch.plan
