# The punk_auth project: Punk::Auth's default schema, one script set per
# engine. The engine comes from the target punk sqitch supplies; this file
# only says where each engine's scripts are.
[engine "sqlite"]
	deploy_dir = sqlite/deploy
	revert_dir = sqlite/revert
	verify_dir = sqlite/verify
[engine "pg"]
	deploy_dir = pg/deploy
	revert_dir = pg/revert
	verify_dir = pg/verify
[engine "mysql"]
	deploy_dir = mysql/deploy
	revert_dir = mysql/revert
	verify_dir = mysql/verify
