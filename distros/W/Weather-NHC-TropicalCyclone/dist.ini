name    = Weather-NHC-TropicalCyclone
author  = danx <danx@cpan.org>
license = Perl_5
copyright_holder = public domain
abstract = Convenient access to NHC tropical cyclone status and products

[VersionFromModule]
[@Basic]
[MetaJSON]
[MetaProvides::Package]

[PruneFiles]
match = ^t/unit/

[MetaResources]
homepage = https://metacpan.org/dist/Weather-NHC-TropicalCyclone
repository.url = https://github.com/oodler577/p5-weather-nhc-tropcialcyclone.git
repository.web = https://github.com/oodler577/p5-weather-nhc-tropcialcyclone
repository.type = git
bugtracker.web = https://github.com/oodler577/p5-weather-nhc-tropcialcyclone/issues

[Prereqs]
perl              = 5.010
Dispatch::Fu      = 1.06
HTTP::Tiny        = 0
IO::Socket::SSL   = 0
JSON::PP          = 0
Scalar::Util      = 0
Time::Local       = 0
Util::H2O::More   = 0.4.6

[Prereqs / TestRequires]
File::Temp        = 0
Test::More        = 0.98

[Prereqs / DevelopRequires]
Devel::Cover      = 1.40
Test::Pod         = 1.52

[TestRelease]
